[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fibsem-plugin-example"
version = "0.1.0"
description = "Example fibsemOS plugin: a milling pattern, a milling strategy, an AutoLamella task and a device driver"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT License" }
# Not a bare `fibsem`. Every module declares its fields in the metadata
# vocabulary of fibsemOS 0.6 (`Display`, `param` and `distance_param`, in
# `fibsem.structures`). An unbounded dependency
# resolves to whatever is newest on PyPI -- 0.5.3 at the time of writing --
# and then every entry point below fails at import. The
# loader catches each one, so the app starts normally and all the
# extensions are simply absent. A floor turns that into a pip resolution
# error, which you cannot miss.
#
# The `.dev0` suffix is deliberate, not sloppiness. PEP 440 orders
# `0.6.0.dev0` *below* `0.6.0`, so a plain `>=0.6.0` rejects every development
# install of fibsemOS -- including the `@main` install this repo's CI builds
# against, which reports itself as 0.6.0.dev0.
dependencies = ["fibsem>=0.6.0.dev0"]

[project.optional-dependencies]
# httpx: fastapi's TestClient, which the scanner's App Server test uses.
test = ["pytest>=7.2", "httpx"]

# ---------------------------------------------------------------------------
# This is the part that makes it a plugin.
#
# Each table below is one of fibsemOS's four extension points. The key on the
# left is a label of your choosing (it is not shown anywhere in the app); the
# value on the right is "importable.module:ClassName".
#
# fibsemOS reads these at startup via importlib.metadata, so your classes are
# picked up with no changes to fibsem itself. There is no registration call to
# make and no file to edit in the fibsem tree.
#
# Two things to get right, because both fail quietly:
#
#   1. The group names must be spelled exactly as below. Nothing scans for
#      near-misses, so a plugin under "fibsem.stratagies" produces no error,
#      no warning and no log line -- it simply never loads.
#
#   2. Re-run `pip install -e .` after editing this file. Entry points are
#      baked into the installed metadata, not read from your source tree, so
#      edits here do nothing until the package is reinstalled.
# ---------------------------------------------------------------------------

[project.entry-points."fibsem.milling.patterns"]
example_plugin_pattern = "fibsem_plugin_example.patterns:ExamplePluginPattern"

[project.entry-points."fibsem.milling.strategies"]
example_plugin_strategy = "fibsem_plugin_example.strategies:ExamplePluginMillingStrategy"

[project.entry-points."fibsem.autolamella.tasks"]
example_autolamella_task = "fibsem_plugin_example.tasks:ExampleAutoLamellaTask"

# A driver entry point names a function returning a DriverEntry, not a class.
# fibsemOS reads this group the first time a driver is looked up.
[project.entry-points."fibsem.drivers"]
fakescan = "fibsem_plugin_example.scanner:driver"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

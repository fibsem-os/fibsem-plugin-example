name: Plugin contract

# An example that rots is worse than none: it fails in ways users cannot
# diagnose, and they assume they broke it. So this runs against fibsemOS `main`
# on every change here, and on a schedule to catch changes upstream.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Not fibsemOS's full support matrix, but it must include this
        # package's own floor from pyproject.toml. An untested floor is a claim
        # you cannot back -- and it is exactly where version-dependent bugs
        # hide. It also cannot go below fibsemOS's own floor (3.10): pip
        # refuses to install fibsem on anything older.
        python-version: ["3.10", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Qt's offscreen platform still loads libGL and libEGL.
      - name: Install Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1

      - name: Install fibsemOS from main
        run: |
          python -m pip install --upgrade pip
          # Deliberately unpinned. The point of this workflow is to notice when
          # main moves under us.
          #
          # The pattern, strategy and task need neither extra. The scanner's
          # tests also check it in the application ([ui]) and served by the
          # App Server and the device server ([server]).
          python -m pip install "fibsem[ui,server] @ git+https://github.com/fibsem-os/fibsem-os.git@main"

      - name: Install the plugin
        run: python -m pip install -e ".[test]"

      - name: Check the contract
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v
